<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense & Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <button id="theme-toggle" class="theme-toggle" title="Toggle Dark Mode">
        🌙
      </button>
      <h1>Expense & Budget Visualizer</h1>
    </header>

    <main class="container">
      <section class="card balance-card">
        <h2>TOTAL BALANCE</h2>
        <p id="total-balance">$0.00</p>
      </section>

      <section class="card form-card">
        <h3>Add Transaction</h3>
        <form id="transaction-form">
          <div class="form-group">
            <label for="text">Item Name</label>
            <input
              type="text"
              id="text"
              placeholder="Enter item name..."
              required
            />
          </div>
          <div class="form-group">
            <label for="amount">Amount</label>
            <input
              type="number"
              step="0.01"
              id="amount"
              placeholder="Enter amount..."
              required
            />
          </div>
          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" required>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
              <option value="Shopping">Shopping</option>
            </select>
          </div>
          <button type="submit" class="btn-primary">Add Transaction</button>
        </form>
      </section>

      <div class="dashboard-grid">
        <section class="card card-section">
          <div class="section-header">
            <h3>Transactions</h3>
            <div class="sorting-menu">
              <label for="sort-select">Sort by:</label>
              <select id="sort-select">
                <option value="date-desc">Newest First</option>
                <option value="date-asc">Oldest First</option>
                <option value="amount-desc">Amount (High-Low)</option>
                <option value="amount-asc">Amount (Low-High)</option>
                <option value="text-asc">Name A-Z</option>
                <option value="text-desc">Name Z-A</option>
                <option value="category-asc">Category A-Z</option>
                <option value="category-desc">Category Z-A</option>
              </select>
            </div>
          </div>
          <ul id="transaction-list" class="list">
            <!-- data inputan dari JS -->
          </ul>
        </section>

        <section class="card chart-section">
          <div class="section-header">
            <h3>Spending by Category</h3>
            <div class="stats-display">
              <div class="stat-item">
                <span class="stat-label">Total Items</span>
                <span id="total-items" class="stat-value">0</span>
              </div>
              <div class="stat-item">
                <span class="stat-label">Avg Spending</span>
                <span id="avg-spending" class="stat-value">$0.00</span>
              </div>
            </div>
          </div>

          <div class="chart-container">
            <div id="pie-chart" class="pie-chart"></div>
          </div>

          <div id="chart-legend" class="legend"></div>
        </section>
      </div>
    </main>
    <script src="js/script.js"></script>
  </body>
</html>
